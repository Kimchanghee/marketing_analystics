<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>페이지를 찾을 수 없음 - Creator Control Center</title>
    <link rel="stylesheet" href="{{ asset_url(request, 'css/style.css') }}">
    <link rel="stylesheet" href="{{ asset_url(request, 'css/style-modern.css') }}">
    <style>
        .error-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 70vh;
            text-align: center;
            padding: 2rem;
        }
        
        .error-code {
            font-size: 6rem;
            font-weight: bold;
            color: #4f46e5;
            margin-bottom: 1rem;
        }
        
        .error-title {
            font-size: 2rem;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 1rem;
        }
        
        .error-message {
            font-size: 1.125rem;
            color: #6b7280;
            max-width: 600px;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        
        .error-actions {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .btn-primary {
            background-color: #4f46e5;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            text-decoration: none;
            font-weight: 500;
            transition: background-color 0.2s;
        }
        
        .btn-primary:hover {
            background-color: #4338ca;
        }
        
        .btn-secondary {
            background-color: #f3f4f6;
            color: #374151;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            text-decoration: none;
            font-weight: 500;
            transition: background-color 0.2s;
        }
        
        .btn-secondary:hover {
            background-color: #e5e7eb;
        }
        
        .error-illustration {
            max-width: 300px;
            margin-bottom: 2rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    {% extends "base.html" %}
    
    {% block content %}
    <div class="error-container">
        <div class="error-illustration">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
        </div>
        
        <div class="error-code">404</div>
        <h1 class="error-title">페이지를 찾을 수 없습니다</h1>
        
        <p class="error-message">
            요청하신 페이지가 존재하지 않거나 이동되었을 수 있습니다.<br>
            URL을 확인하시거나 아래 버튼을 통해 원하는 페이지로 이동해보세요.
        </p>
        
        <div class="error-actions">
            <a href="/" class="btn-primary">홈으로 이동</a>
            <a href="/dashboard" class="btn-secondary">대시보드</a>
            <a href="/services" class="btn-secondary">서비스 소개</a>
            <a href="/support" class="btn-secondary">고객 지원</a>
        </div>
        
        <div style="margin-top: 3rem; color: #9ca3af; font-size: 0.875rem;">
            <p>문제가 지속되면 <a href="/support" style="color: #4f46e5; text-decoration: underline;">고객 지원팀</a>에 문의해주세요.</p>
        </div>
    </div>
    {% endblock %}
</body>
</html>
